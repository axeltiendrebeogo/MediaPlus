services:
  - type: web
    name: mediapulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: mediapulse-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://VOTRE-SOUS-DOMAINE.hostinger.com
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_LIFETIME
        value: "15"
      - key: REFRESH_TOKEN_LIFETIME
        value: "7"
      - key: PDF_STORAGE_PATH
        value: media/rapports/
      - key: RAPPORTS_QUOTA_MAX
        value: "3"
      - key: RAPPORTS_QUOTA_FENETRE_HEURES
        value: "4"
      - key: RAPPORTS_TIMEOUT_SECONDES
        value: "120"
